# Configuração do Nginx como balanceador de carga.
#
# O Nginx é executado a partir da pasta do projeto, sem root:
#   nginx -p <projeto>/run/nginx/ -c <projeto>/nginx/nginx.conf
# (use scripts/start_nginx.sh). Caminhos relativos em "pid", "error_log" e
# "*_temp_path" valem a partir do prefixo -p; o "include" vale a partir da
# pasta deste arquivo.

# IMPORTANTE: manter 1 worker. Sem memória compartilhada ("zone"), cada
# worker conta as próprias conexões; com 1 worker, o Least Connections
# enxerga todas as conexões ativas.
worker_processes 1;

pid nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    # Log com o servidor que respondeu (cabeçalho X-Server-ID da aplicação).
    log_format balanceador '$remote_addr [$time_local] "$request" $status '
                           'servidor=$upstream_http_x_server_id '
                           'upstream=$upstream_addr tempo=$request_time';
    access_log logs/access.log balanceador;

    client_body_temp_path temp/client_body;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    # Grupo "app_servers" com as 3 instâncias e o algoritmo ativo.
    # Arquivo gerado por scripts/set_algorithm.sh a partir de nginx/algorithms/.
    include upstream.active.conf;

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Informa ao cliente qual instância atendeu (além do X-Server-ID
            # que a própria aplicação já envia).
            add_header X-Upstream $upstream_addr always;
        }
    }
}
