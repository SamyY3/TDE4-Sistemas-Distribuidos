# Round Robin: algoritmo padrão do Nginx. Distribui as requisições em
# sequência (1, 2, 3, 1, 2, 3...), sem considerar a carga de cada servidor.
#
# max_fails=1 fail_timeout=5s: após 1 falha, o servidor é considerado fora do
# ar por 5 s e deixa de receber requisições; depois disso o Nginx tenta de novo.
upstream app_servers {
    server 127.0.0.1:5001 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:5002 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:5003 max_fails=1 fail_timeout=5s;
}
